<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Vibrant DSC Monogram Gradient -->
    <linearGradient id="dscGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Accent Glow -->
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#3b82f6" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base with Cyber Edge -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect width="506" height="506" x="3" y="3" rx="113" fill="none" stroke="url(#dscGrad)" stroke-width="3" opacity="0.4" />

  <!-- Ambient Glow Behind Monogram -->
  <circle cx="256" cy="256" r="140" fill="#6366f1" opacity="0.22" filter="url(#glow)" />

  <!-- Geometric Tech Polygon Frame -->
  <polygon points="256,70 410,158 410,354 256,442 102,354 102,158" 
           fill="none" stroke="url(#cyanAccent)" stroke-width="4" stroke-dasharray="14 8" opacity="0.4" />

  <!-- DSC Stylized Monogram Lettering -->
  <g filter="url(#shadow)" transform="translate(0, 0)">
    <!-- Main DSC Typography -->
    <text x="256" y="295" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="142" 
          font-weight="900" 
          letter-spacing="5"
          text-anchor="middle" 
          fill="url(#dscGrad)">DSC</text>

    <!-- Tech Accent Bar Underneath -->
    <rect x="140" y="330" width="232" height="8" rx="4" fill="url(#cyanAccent)" />
    
    <!-- Mini Subtitle pill -->
    <text x="256" y="375" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="22" 
          font-weight="800" 
          letter-spacing="9"
          text-anchor="middle" 
          fill="#94a3b8">INTELLIGENCE</text>
  </g>

  <!-- Glowing Star Node -->
  <circle cx="410" cy="158" r="8" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="102" cy="354" r="8" fill="#ec4899" filter="url(#glow)" />
</svg>
